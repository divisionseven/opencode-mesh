codecov:
  require_ci_to_pass: true
coverage:
  status:
    project:
      default:
        target: 90%
        threshold: 0%
        informational: false
    patch:
      default:
        target: 90%
        informational: false
comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: false
