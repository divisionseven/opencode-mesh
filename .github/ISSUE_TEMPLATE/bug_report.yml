name: 🐛 Bug Report
description: Report a reproducible bug or unexpected behaviour in OpenCode-Mesh.
title: "bug: "
labels: ["bug", "status: needs-triage"]
assignees:
  - divisionseven

body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a bug. Please fill out this form as completely as possible.
        If you have a security vulnerability to report, please **DO NOT** use this form. Use the [private security advisory]( https://github.com/divisionseven/opencode-mesh/security/advisories/new) instead.

  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-flight Checklist
      description: Please confirm all of the following before submitting.
      options:
        - label: I have searched existing issues and this has not been reported before.
          required: true
        - label: I am using the latest version of OpenCode-Mesh (`mesh --version`).
          required: true
        - label: I have read the documentation and this is not expected behaviour.
          required: true

  - type: input
    id: version
    attributes:
      label: OpenCode-Mesh Version
      description: Output of `mesh --version`
      placeholder: "e.g. 1.2.3"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - macOS
        - Linux (Ubuntu / Debian)
        - Linux (Fedora / RHEL)
        - Linux (Arch)
        - Linux (Other)
        - Windows 10
        - Windows 11
        - Other
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js Version
      description: Output of `node --version` and `npm --version` (plus `mesh --version` above)
      placeholder: "e.g. v22.14.0 / npm 10.9.2"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug. What did you expect to happen? What actually happened?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Provide the exact steps needed to reproduce the issue.
      placeholder: |
        1. Run `mesh install ...`
        2. With the following config: ...
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behaviour
      description: What did you expect OpenCode-Mesh to do?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behaviour
      description: What did OpenCode-Mesh actually do? Include the full output if possible.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs / Output
      description: Paste any relevant terminal output, error messages, or stack traces here.
      render: shell

  - type: textarea
    id: config
    attributes:
      label: OpenCode-Mesh Configuration
      description: Paste the contents of your `mesh config show` output (redact any sensitive values).
      render: yaml

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Anything else that might help diagnose the issue (screenshots, links, related issues, etc).
